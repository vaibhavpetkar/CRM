# /etc/nginx/sites-available/crm.eleviq.buzz
#
# Assumes:
#   - Next.js frontend running via `next start` (or PM2) on 127.0.0.1:3000
#   - Backend (Express + Socket.IO) running via PM2 cluster on 127.0.0.1:5000
#   - TLS cert already provisioned (e.g. certbot) for crm.eleviq.buzz
#
# No sticky-session / ip_hash config needed here: the socket is WebSocket-only
# (see frontend/lib/socket.ts + backend/src/realtime/socket.ts), and a single
# TCP connection stays pinned to whichever PM2 worker accepted it for its
# whole lifetime — sticky sessions only matter if long-polling is in play.

upstream crm_frontend {
    server 127.0.0.1:3000;
}

upstream crm_backend {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name crm.eleviq.buzz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.eleviq.buzz;

    ssl_certificate     /etc/letsencrypt/live/crm.eleviq.buzz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.eleviq.buzz/privkey.pem;

    client_max_body_size 15M; # backend allows up to 10mb JSON bodies + file attachments

    # ── Socket.IO (real-time notifications) ─────────────────────────────────
    # Must come before the general /api/ block below since it's more specific.
    location /socket.io/ {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets are long-lived — the default 60s proxy_read_timeout will
        # silently drop idle connections. Keep this well above your client's
        # ping interval (Socket.IO default pingInterval is 25s).
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ── REST API ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Uploaded file attachments (served statically by Express) ────────────
    location /uploads/ {
        proxy_pass http://crm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Next.js frontend (everything else) ──────────────────────────────────
    location / {
        proxy_pass http://crm_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev-mode HMR also needs Upgrade headers; harmless in prod.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
