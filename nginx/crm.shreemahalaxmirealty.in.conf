# /etc/nginx/sites-available/crm.shreemahalaxmirealty.in
#
# Assumes:
#   - Next.js frontend running via `next start` (or PM2) on 127.0.0.1:3000
#   - Backend (Express + Socket.IO) running via PM2 cluster on 127.0.0.1:5000
#   - TLS cert already provisioned (e.g. certbot) for crm.shreemahalaxmirealty.in
#
# No sticky-session / ip_hash config needed here: the socket is WebSocket-only
# (see frontend/lib/socket.ts + backend/src/realtime/socket.ts), and a single
# TCP connection stays pinned to whichever PM2 worker accepted it for its
# whole lifetime — sticky sessions only matter if long-polling is in play.

upstream crm_frontend {
    server 127.0.0.1:3000;
}

upstream crm_backend {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name crm.shreemahalaxmirealty.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.shreemahalaxmirealty.in;

    ssl_certificate     /etc/letsencrypt/live/crm.shreemahalaxmirealty.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.shreemahalaxmirealty.in/privkey.pem;

    client_max_body_size 15M; # backend allows up to 10mb JSON bodies + file attachments

    # ── Socket.IO (real-time notifications) ─────────────────────────────────
    # Must come before the general /api/ block below since it's more specific.
    location /socket.io/ {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets are long-lived — the default 60s proxy_read_timeout will
        # silently drop idle connections. Keep this well above your client's
        # ping interval (Socket.IO default pingInterval is 25s).
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ── AI Assistant (summaries, chat) ────────────────────────────────────────
    # Must come before the general /api/ block below since it's more specific.
    # LLM generation is much slower than a normal CRUD request, and the
    # backend itself now has its own queue + timeout (AI_MAX_CONCURRENT /
    # AI_QUEUE_WAIT_MS / AI_REQUEST_TIMEOUT_MS, worst case ~65s) that always
    # returns a clean JSON error. This timeout just needs to stay comfortably
    # above that so the backend's JSON response wins the race instead of
    # nginx's default 60s proxy_read_timeout cutting in first with its own
    # HTML error page (the "non-JSON response" issue).
    location /api/ai/ {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # ── Backups (super admin) ────────────────────────────────────────────────
    # Must come before the general /api/ block below since it's more specific.
    # Uploading a backup file can be up to 2 GB, and taking or restoring a
    # backup of a big database can take minutes, so this block lifts the body
    # size limit, streams uploads straight to the backend and waits longer.
    location /api/admin/backups {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 2100M;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30m;
        proxy_read_timeout 30m;
    }

    # ── REST API ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Uploaded file attachments (served statically by Express) ────────────
    location /uploads/ {
        proxy_pass http://crm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Next.js frontend (everything else) ──────────────────────────────────
    location / {
        proxy_pass http://crm_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev-mode HMR also needs Upgrade headers; harmless in prod.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
