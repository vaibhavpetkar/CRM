# /etc/nginx/sites-available/crm.inveontechnologies.in
#
# Frontend-only. The frontend calls the API directly on the api.* subdomain
# (see frontend/.env.production.example -> NEXT_PUBLIC_API_URL), so this
# server block does NOT need /api, /socket.io, or /uploads proxying — that
# all lives in api.inveontechnologies.in.conf.
#
# Assumes:
#   - Next.js frontend container/process on 127.0.0.1:3000
#   - TLS cert already provisioned (e.g. certbot) for crm.inveontechnologies.in

upstream crm_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name crm.inveontechnologies.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.inveontechnologies.in;

    ssl_certificate     /etc/letsencrypt/live/crm.inveontechnologies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.inveontechnologies.in/privkey.pem;

    client_max_body_size 15M;

    location / {
        proxy_pass http://crm_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev-mode HMR also needs Upgrade headers; harmless in prod.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
