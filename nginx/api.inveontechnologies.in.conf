# /etc/nginx/sites-available/api.inveontechnologies.in
#
# Backend-only (Express + Socket.IO). Matches NEXT_PUBLIC_API_URL in
# frontend/.env.production.example -> https://api.inveontechnologies.in/api
#
# Assumes:
#   - Backend (Express + Socket.IO) container/process on 127.0.0.1:5000
#   - TLS cert already provisioned (e.g. certbot) for api.inveontechnologies.in

upstream crm_backend {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name api.inveontechnologies.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.inveontechnologies.in;

    ssl_certificate     /etc/letsencrypt/live/api.inveontechnologies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.inveontechnologies.in/privkey.pem;

    client_max_body_size 15M; # backend allows up to 10mb JSON bodies + file attachments

    # ── Socket.IO (real-time notifications) ─────────────────────────────────
    # Must come before the general /api/ block below since it's more specific.
    location /socket.io/ {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets are long-lived — the default 60s proxy_read_timeout will
        # silently drop idle connections. Keep this well above your client's
        # ping interval (Socket.IO default pingInterval is 25s).
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ── AI Assistant (summaries, chat) ────────────────────────────────────────
    # Must come before the general /api/ block below since it's more specific.
    location /api/ai/ {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # ── REST API ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Uploaded file attachments (served statically by Express) ────────────
    location /uploads/ {
        proxy_pass http://crm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
