name: Android app release

# Builds the Android app (android/) and publishes a GitHub release with the
# APK attached.
#
# - Push a tag like crm-v2.0.1 to build and publish release "crm-v2.0.1".
#   Tags must not start with "v": deploy.yml deploys master on v* tags.
# - Pull requests that touch android/ build the APK as a check (no release).
#
# Release notes come from docs/releases/<tag>.md when that file exists,
# otherwise GitHub generates them from the merged pull requests.
#
# Signing: add the secrets ANDROID_KEYSTORE_BASE64 (base64 of the .jks),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to
# sign with your own key (see android/README.md). Without them the APK is
# signed with a temporary debug key.
on:
  push:
    tags:
      - 'crm-v*'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. crm-v2.0.1'
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then TAG="$GITHUB_REF_NAME";
          elif [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG";
          else TAG="crm-v0.0.0-pr${{ github.event.pull_request.number }}"; fi
          VERSION="${TAG#crm-v}"
          # versionCode must grow with every release: 2.0.1 -> 20001.
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          [ "$CODE" -gt 0 ] || CODE=1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (versionName $VERSION, versionCode $CODE)"

      - name: Set up the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so the APK is signed with a debug key. Phones must uninstall it before installing an APK signed with the real key."
          fi

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName='${{ steps.version.outputs.version }}' \
            -PappVersionCode='${{ steps.version.outputs.code }}'
          APK="InveonOneCRM-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "../$APK"
          cd .. && sha256sum "$APK" > "$APK.sha256" && cat "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256

      - name: Pick the release notes
        if: github.event_name != 'pull_request'
        id: notes
        run: |
          NOTES="docs/releases/${{ steps.version.outputs.tag }}.md"
          if [ -f "$NOTES" ]; then echo "path=$NOTES" >> "$GITHUB_OUTPUT"; fi

      - name: Publish the release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Inveon One CRM ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          make_latest: true
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
