name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,EMAIL_SERVICE,EMAIL_USER,EMAIL_PASS,EMAIL_FROM,EMAIL_SECURE,CLIENT_URL,JWT_SECRET,DB_PASSWORD,SUPER_ADMIN_EMAIL,SUPER_ADMIN_PASSWORD,NEXT_PUBLIC_API_URL,NEXT_PUBLIC_GOOGLE_CLIENT_ID
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          EMAIL_SERVICE: ${{ secrets.EMAIL_SERVICE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          script: |
            # Navigate to the project directory on the VPS
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            
            # Create .env file with all required environment variables
            cat > .env << 'EOF'
            NODE_ENV=production
            PORT=5000
            DB_HOST=postgres
            DB_PORT=5432
            DB_NAME=crm_db
            DB_USERNAME=postgres
            DB_PASSWORD=${DB_PASSWORD}
            REDIS_URL=redis://redis:6379
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRES_IN=7d
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            EMAIL_SERVICE=${EMAIL_SERVICE}
            EMAIL_USER=${EMAIL_USER}
            EMAIL_PASS=${EMAIL_PASS}
            EMAIL_FROM=${EMAIL_FROM}
            EMAIL_SECURE=${EMAIL_SECURE}
            CLIENT_URL=${CLIENT_URL}
            SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
            SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
            NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
            EOF
            
            # Pull the latest changes from Git
            git fetch --all
            git reset --hard origin/master
            
            # Rebuild and restart the Docker containers
            sudo docker compose down
            sudo docker compose up -d --build
            
            # Run any pending DB migrations against the now-running backend
            # container. Without this, new columns/tables added by a
            # migration (e.g. Meeting/Task -> Lead/Deal/Contact FKs) exist in
            # the model but not the DB, and every query that touches them
            # 500s in production even though the build succeeded.
            sudo docker compose exec -T backend npm run migrate
            
            # Prune unused images to save disk space
            sudo docker image prune -f
            
            # Update and reload host Nginx config automatically
            sudo cp ${{ secrets.VPS_DEPLOY_PATH }}/nginx/crm.eleviq.buzz.conf /etc/nginx/sites-available/crm.eleviq.buzz
            sudo nginx -t && sudo systemctl reload nginx
