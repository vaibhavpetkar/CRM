name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            # Navigate to the project directory on the VPS
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            
            # Pull the latest changes from Git
            git fetch --all
            git reset --hard origin/master
            
            # Rebuild and restart the Docker containers
            sudo docker compose down
            sudo docker compose up -d --build
            
            # Prune unused images to save disk space
            sudo docker image prune -f

            # Update and reload host Nginx config automatically
            sudo cp /var/www/crm/nginx/crm.eleviq.buzz.conf /etc/nginx/sites-available/crm.eleviq.buzz
            sudo nginx -t && sudo systemctl reload nginx
