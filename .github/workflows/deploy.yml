name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: VPS_DEPLOY_PATH
          script: |
            # Navigate to the project directory on the VPS
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            
            # Ensure .env exists (create from example if first deploy)
            if [ ! -f .env ]; then
              cat > .env << 'EOF'
              NODE_ENV=production
              PORT=5000
              DB_HOST=postgres
              DB_PORT=5432
              DB_NAME=crm_db
              DB_USERNAME=postgres
              DB_PASSWORD=${DB_PASSWORD}
              REDIS_URL=redis://redis:6379
              JWT_SECRET=${JWT_SECRET}
              JWT_EXPIRES_IN=7d
              GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
              GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
              EMAIL_SERVICE=${EMAIL_SERVICE}
              EMAIL_USER=${EMAIL_USER}
              EMAIL_PASS=${EMAIL_PASS}
              EMAIL_FROM=${EMAIL_FROM}
              EMAIL_SECURE=${EMAIL_SECURE}
              CLIENT_URL=${CLIENT_URL}
              SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
              SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
              NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
              NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
              EOF
            fi
            
            # Pull the latest changes from Git
            git fetch --all
            git reset --hard origin/master
            
            # Rebuild and restart the Docker containers.
            # A recreate that gets interrupted (failed build, dropped SSH,
            # cancelled run) leaves a half-made container behind under
            # Compose's temporary name, e.g. "491c802bc577_crm_frontend".
            # Compose doesn't clean those up itself, and every later deploy
            # then dies with "container name ... is already in use". Remove
            # any such leftovers first; the pattern only matches that
            # temporary <12-hex-id>_crm_<service> form, never the real
            # crm_* containers or anything from other projects on the box.
            sudo docker ps -a --format '{{.ID}} {{.Names}}' \
              | grep -E ' [0-9a-f]{12}_crm_[a-z]+$' \
              | awk '{print $1}' \
              | xargs -r sudo docker rm -f
            sudo docker compose down --remove-orphans
            sudo docker compose up -d --build --remove-orphans
            
            # Run any pending DB migrations against the now-running backend
            # container. Without this, new columns/tables added by a
            # migration (e.g. Meeting/Task -> Lead/Deal/Contact FKs) exist in
            # the model but not the DB, and every query that touches them
            # 500s in production even though the build succeeded.
            sudo docker compose exec -T backend npm run migrate
            
            # Prune unused images to save disk space
            sudo docker image prune -f
            
            # NOTE: routing for crm.inveontechnologies.in and
            # api.inveontechnologies.in is handled by the separate
            # containerized nginx in the inveontechnologies-website repo
            # (nginx/inveontechnologies.in.conf, built into its own Docker
            # image and bound to host ports 80/443 — confirmed via
            # `ss -tlnp`, which showed only docker-proxy on those ports).
            # There is no host-installed nginx on this VPS (`/etc/nginx`
            # doesn't exist), so this step used to fail every deploy trying
            # to write to /etc/nginx/sites-available. The nginx/*.conf files
            # in this repo are unused leftovers from an earlier host-nginx
            # setup; if that setup is ever reintroduced, this step (and a
            # sites-enabled symlink step, which was also missing) would need
            # to come back too.
