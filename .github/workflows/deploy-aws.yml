name: Deploy real-estate to AWS

# Pushes to the real-estate branch deploy to the AWS EC2 server.
# master keeps deploying to the old VPS through deploy.yml; the two use
# different secrets, so neither can touch the other's server.
on:
  push:
    branches:
      - real-estate
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check AWS secrets are set
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          if [ -z "$AWS_HOST" ]; then
            echo "::error::AWS_HOST secret is not set. Add AWS_HOST, AWS_USER, AWS_SSH_KEY and AWS_DEPLOY_PATH (see docs/deploy-aws.md)."
            exit 1
          fi

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.AWS_DEPLOY_PATH }}

            if [ ! -f .env ]; then
              echo "No .env in $(pwd). Copy .env.example to .env and fill it in first (docs/deploy-aws.md)."
              exit 1
            fi

            # Always run the real-estate branch on this server.
            git fetch origin real-estate
            git checkout -B real-estate origin/real-estate
            git reset --hard origin/real-estate

            # docker-compose.prod.yml adds the nginx container that serves HTTPS.
            COMPOSE="sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml"

            # Remove half-created containers left by an interrupted earlier deploy.
            sudo docker ps -a --format '{{.ID}} {{.Names}}' \
              | grep -E ' [0-9a-f]{12}_crm_[a-z]+$' \
              | awk '{print $1}' \
              | xargs -r sudo docker rm -f

            $COMPOSE up -d --build --remove-orphans

            # Wait for the backend before migrating.
            for i in $(seq 1 30); do
              $COMPOSE exec -T backend wget -qO- http://127.0.0.1:5000/api/health >/dev/null 2>&1 && break
              sleep 5
            done
            $COMPOSE exec -T backend npm run migrate

            sudo docker image prune -f
