services:
  postgres:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-crm_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: always
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - crm_network

  # Free, local AI provider for the AI Assistant (item: lead/deal summaries,
  # quote follow-ups, chat widget). No API key, no per-request cost. Runs
  # llama3.2:1b by default — the smallest/fastest Llama model, chosen for
  # small (2 vCPU, no GPU) VPS boxes where per-request speed matters more
  # than model size. Bump OLLAMA_MODEL to llama3.2:3b or llama3.1 for better
  # accuracy if your server has more CPU to spare.
  #
  # Concurrency: this is CPU inference sharing the box with everything else,
  # it does NOT get faster just by raising OLLAMA_NUM_PARALLEL — that only
  # controls how many of the queued requests are *allowed* to run at once,
  # not how much CPU is available to run them. Set both this and the
  # backend's AI_MAX_CONCURRENT to your actual vCPU/thread count (check with
  # `nproc`), not higher — a bigger number just adds context-switching
  # overhead without adding real throughput. For genuinely fast responses
  # under real concurrency (10+ simultaneous users) on small hardware, set
  # ANTHROPIC_API_KEY below so requests Ollama can't get to immediately
  # overflow to Anthropic's infrastructure instead of queuing on this CPU.
  ollama:
    image: ollama/ollama:latest
    container_name: crm_ollama
    restart: always
    environment:
      # Requests Ollama will actually run at once. Match your real thread
      # count (`nproc`) — e.g. 2 for a 2 vCPU box — and keep this roughly in
      # step with the backend's AI_MAX_CONCURRENT below.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      # How many requests can sit in Ollama's queue before it starts
      # rejecting new ones outright.
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-512}
      # Only one model in use here, so just keep it resident.
      - OLLAMA_MAX_LOADED_MODELS=1
      # Keep the model loaded in RAM between requests — without this, Ollama
      # unloads it after a few minutes idle and the next request pays a slow
      # reload on top of generation time. Matches the backend's keep_alive.
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - crm_network
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${OLLAMA_MODEL:-llama3.2:1b}; wait"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-crm_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_SERVICE=${EMAIL_SERVICE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-}
      # Website "Contact us" form -> CRM lead + emails (routes/publicRoutes.ts)
      - WEBSITE_ORIGINS=${WEBSITE_ORIGINS:-https://inveontechnologies.in,https://www.inveontechnologies.in}
      - WEBSITE_LEAD_NOTIFY_EMAILS=${WEBSITE_LEAD_NOTIFY_EMAILS:-}
      - COMPANY_NAME=${COMPANY_NAME:-Inveon Technologies}
      - CLIENT_URL=${CLIENT_URL:-https://crm.eleviq.buzz}
      # Extra browser origins allowed to call the API (comma-separated), if any.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Facebook / Instagram Lead Ads (Settings > Integrations). Webhook URL:
      # ${CLIENT_URL}/api/webhooks/meta, OAuth redirect: ${CLIENT_URL}/api/integrations/meta/callback
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:-}
      - META_LOGIN_CONFIG_ID=${META_LOGIN_CONFIG_ID:-}
      # Click-to-call (call icon next to phone numbers). Default provider is
      # Exotel; VOICE_PROVIDER=mock gives a demo with no real calls. Call
      # status webhook: ${CLIENT_URL}/api/webhooks/voice/<per-call token>.
      - VOICE_PROVIDER=${VOICE_PROVIDER:-exotel}
      - VOICE_CALLBACK_BASE_URL=${VOICE_CALLBACK_BASE_URL:-}
      - EXOTEL_ACCOUNT_SID=${EXOTEL_ACCOUNT_SID:-}
      - EXOTEL_API_KEY=${EXOTEL_API_KEY:-}
      - EXOTEL_API_TOKEN=${EXOTEL_API_TOKEN:-}
      - EXOTEL_CALLER_ID=${EXOTEL_CALLER_ID:-}
      - EXOTEL_SUBDOMAIN=${EXOTEL_SUBDOMAIN:-}
      - EXOTEL_TIME_LIMIT=${EXOTEL_TIME_LIMIT:-}
      # Vi Business (Vodafone Idea) cloud calling: VOICE_PROVIDER=vi. Fill
      # these from the API document Vi gives you (docs/real-estate-sales.md).
      - VI_API_URL=${VI_API_URL:-}
      - VI_API_KEY=${VI_API_KEY:-}
      - VI_CALLER_ID=${VI_CALLER_ID:-}
      - VI_AUTH_HEADER=${VI_AUTH_HEADER:-}
      - VI_AUTH_SCHEME=${VI_AUTH_SCHEME:-}
      - VI_ACCOUNT_ID=${VI_ACCOUNT_ID:-}
      - VI_REQUEST_TEMPLATE=${VI_REQUEST_TEMPLATE:-}
      - VI_STATUS_URL=${VI_STATUS_URL:-}
      - PORTAL_POLL_MINUTES=${PORTAL_POLL_MINUTES:-10}
      - ACRES99_API_URL=${ACRES99_API_URL:-}
      - HOUSING_API_URL=${HOUSING_API_URL:-}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@crmpro.com}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD in .env}
      # AI Assistant — free, local Ollama provider (see the `ollama` service
      # above). Set ANTHROPIC_API_KEY instead (and leave OLLAMA_BASE_URL
      # unset) if you'd rather use the paid Anthropic API. If both are set,
      # Ollama handles what it can and busy overflow spills to Anthropic —
      # see AI_MAX_CONCURRENT below.
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      # How many AI requests go to Ollama at once — match your real vCPU/
      # thread count (`nproc` on the host), same as OLLAMA_NUM_PARALLEL
      # above. Extras wait briefly (AI_QUEUE_WAIT_MS) then either overflow to
      # Anthropic (if ANTHROPIC_API_KEY is set) or fail fast with a clean
      # "AI Assistant is busy" JSON error — never a raw nginx 504 page.
      - AI_MAX_CONCURRENT=${AI_MAX_CONCURRENT:-2}
      # Ceiling on concurrent Anthropic overflow requests, so a traffic spike
      # can't run up an unbounded bill. Anthropic isn't CPU-bound like Ollama
      # so this can be much higher than AI_MAX_CONCURRENT.
      - ANTHROPIC_MAX_CONCURRENT=${ANTHROPIC_MAX_CONCURRENT:-8}
      - AI_QUEUE_WAIT_MS=${AI_QUEUE_WAIT_MS:-20000}
      - AI_REQUEST_TIMEOUT_MS=${AI_REQUEST_TIMEOUT_MS:-45000}
      # Path to .env file on host (mounted at /host/.env inside container)
      - ENV_FILE_PATH=/host/.env
    volumes:
      - backend_uploads:/usr/src/app/uploads
      # Mount host project root to /host so backend can read/write .env
      - ${VPS_DEPLOY_PATH:-/var/www/crm}:/host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - crm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://crm.eleviq.buzz/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: crm_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://crm.eleviq.buzz/api}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  ollama_data:
