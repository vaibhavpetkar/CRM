version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-crm_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-PYw22xUgZTQzVqZPdG9zov0B}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm_network

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - crm_network

  # Free, local AI provider for the AI Assistant (item: lead/deal summaries,
  # quote follow-ups, chat widget). No API key, no per-request cost. Runs the
  # lightweight llama3.2:3b model by default — small footprint, fast
  # responses, and solid accuracy for CRM-style summarization/chat. Swap
  # OLLAMA_MODEL below (e.g. llama3.2:1b for even less RAM, or llama3.1 for
  # higher quality at the cost of speed) if you want something different.
  ollama:
    image: ollama/ollama:latest
    container_name: crm_ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - crm_network
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${OLLAMA_MODEL:-llama3.2:3b}; wait"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: always
    depends_on:
      - postgres
      - redis
      - ollama
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-crm_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-PYw22xUgZTQzVqZPdG9zov0B}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-fbff9fa7ea086d4b246181dc1993a47277f8f720fbf5246a82dd89714ffc352b9a35886218fc5ce7eb27c6d091201d4560ef18c69ad9ee645ef6313f4e400c04}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_SERVICE=${EMAIL_SERVICE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - CLIENT_URL=${CLIENT_URL:-https://crm.eleviq.buzz}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@crmpro.com}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-et4t8HjfnhRYocM3Z22p!Aa1}
      # AI Assistant — free, local Ollama provider (see the `ollama` service
      # above). Set ANTHROPIC_API_KEY instead (and leave OLLAMA_BASE_URL
      # unset) if you'd rather use the paid Anthropic API.
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      # Path to .env file on host (mounted at /host/.env inside container)
      - ENV_FILE_PATH=/host/.env
    volumes:
      - backend_uploads:/usr/src/app/uploads
      # Mount host project root to /host so backend can read/write .env
      - ${VPS_DEPLOY_PATH:-/var/www/crm}:/host
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - crm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://crm.eleviq.buzz/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: crm_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://crm.eleviq.buzz/api}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  ollama_data:
