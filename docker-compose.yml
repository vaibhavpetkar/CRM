version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-crm_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-PYw22xUgZTQzVqZPdG9zov0B}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm_network

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - crm_network

  # Free, local AI provider for the AI Assistant (item: lead/deal summaries,
  # quote follow-ups, chat widget). No API key, no per-request cost. Runs the
  # lightweight llama3.2:3b model by default — small footprint, fast
  # responses, and solid accuracy for CRM-style summarization/chat. Swap
  # OLLAMA_MODEL below (e.g. llama3.2:1b for even less RAM, or llama3.1 for
  # higher quality at the cost of speed) if you want something different.
  #
  # Concurrency: this is CPU inference sharing the box with everything else,
  # it does NOT get faster just by raising OLLAMA_NUM_PARALLEL — that only
  # controls how many of the queued requests are *allowed* to run at once,
  # not how much CPU is available to run them. On a 2-4 vCPU VPS, 10
  # simultaneous AI requests will still take real wall-clock time; what these
  # settings (together with AI_MAX_CONCURRENT on the backend) buy you is
  # *predictable* behavior — a bounded queue with clear errors — instead of
  # everything queuing silently until nginx's proxy times out with an HTML
  # error page. For genuinely fast concurrent AI at 10+ simultaneous users,
  # either give this container more CPU/a GPU, drop to llama3.2:1b, or set
  # ANTHROPIC_API_KEY so bursts fall back to Anthropic's infrastructure
  # instead of this one box.
  ollama:
    image: ollama/ollama:latest
    container_name: crm_ollama
    restart: always
    environment:
      # Requests Ollama will actually run at once (extra ones queue inside
      # Ollama itself, on top of the backend's own AI_MAX_CONCURRENT queue —
      # keep the two roughly in step). Raise this only if you've also given
      # the container more CPU; otherwise it just increases contention.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      # How many requests can sit in Ollama's queue before it starts
      # rejecting new ones outright.
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-512}
      # Only one model in use here, so just keep it resident.
      - OLLAMA_MAX_LOADED_MODELS=1
      # Keep the model loaded in RAM between requests — without this, Ollama
      # unloads it after a few minutes idle and the next request pays a slow
      # reload on top of generation time. Matches the backend's keep_alive.
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - crm_network
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${OLLAMA_MODEL:-llama3.2:3b}; wait"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: always
    depends_on:
      - postgres
      - redis
      - ollama
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-crm_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-PYw22xUgZTQzVqZPdG9zov0B}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-fbff9fa7ea086d4b246181dc1993a47277f8f720fbf5246a82dd89714ffc352b9a35886218fc5ce7eb27c6d091201d4560ef18c69ad9ee645ef6313f4e400c04}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_SERVICE=${EMAIL_SERVICE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - CLIENT_URL=${CLIENT_URL:-https://crm.eleviq.buzz}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@crmpro.com}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-et4t8HjfnhRYocM3Z22p!Aa1}
      # AI Assistant — free, local Ollama provider (see the `ollama` service
      # above). Set ANTHROPIC_API_KEY instead (and leave OLLAMA_BASE_URL
      # unset) if you'd rather use the paid Anthropic API.
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      # How many AI requests the backend forwards to the provider at once —
      # extras wait briefly (AI_QUEUE_WAIT_MS) then fail fast with a clean
      # "AI Assistant is busy" JSON error instead of hanging until nginx
      # returns a raw 504 page. See the `ollama` service above for context.
      - AI_MAX_CONCURRENT=${AI_MAX_CONCURRENT:-4}
      - AI_QUEUE_WAIT_MS=${AI_QUEUE_WAIT_MS:-20000}
      - AI_REQUEST_TIMEOUT_MS=${AI_REQUEST_TIMEOUT_MS:-45000}
      # Path to .env file on host (mounted at /host/.env inside container)
      - ENV_FILE_PATH=/host/.env
    volumes:
      - backend_uploads:/usr/src/app/uploads
      # Mount host project root to /host so backend can read/write .env
      - ${VPS_DEPLOY_PATH:-/var/www/crm}:/host
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - crm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://crm.eleviq.buzz/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: crm_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://crm.eleviq.buzz/api}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  ollama_data:
