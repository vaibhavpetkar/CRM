<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No connection</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f4f7fc; color: #0b1a3a;
    font-family: system-ui, -apple-system, Roboto, sans-serif; text-align: center;
  }
  .card { background: #fff; border-radius: 16px; padding: 32px 24px; margin: 16px; max-width: 360px;
          box-shadow: 0 4px 20px rgba(7, 21, 51, .08); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #64748b; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
  button { background: #0066ff; color: #fff; border: 0; border-radius: 10px; padding: 12px 28px;
           font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h1>Can't reach the CRM</h1>
    <p>Check that the phone is online, then try again.</p>
    <button onclick="window.CRMApp &amp;&amp; window.CRMApp.retry()">Try again</button>
  </div>
</body>
</html>
